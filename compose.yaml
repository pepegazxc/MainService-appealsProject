services:
  notification-service:
    build: .
    networks:
      - kafka-network
    env_file:
      - .env
    environment:
      - KAFKA_BROKER=kafka:9092

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata: